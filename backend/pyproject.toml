[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-backend"
version = "0.1.0"
description = "LUMEN Studio local backend service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "platformdirs>=4.3",
    "pillow>=11.0",
    "pillow-heif>=0.20",
    "rawpy>=0.24",
    "xxhash>=3.5",
    "pyexiftool>=0.5.6",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "keyring>=25",
]

[project.optional-dependencies]
# Local AI. Install PyTorch with CUDA from the PyTorch index, e.g.:
#   pip install -e .[ai] --extra-index-url https://download.pytorch.org/whl/cu130
ai = [
    "torch>=2.8",
    "torchvision>=0.23",
    "transformers>=5.0",
    "huggingface_hub>=0.30",
    "safetensors>=0.5",
    "sentencepiece>=0.2",
    "protobuf>=5",
]
# OpenCLIP models for comparison experiments (python -m lumen.ai.bench).
bench = ["open_clip_torch>=3.0"]
dev = [
    "pytest>=8.3",
    "httpx2>=2.16",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
lumen-backend = "lumen.__main__:main"

[tool.setuptools.packages.find]
include = ["lumen*"]

[tool.setuptools.package-data]
"lumen.db" = ["migrations/*.sql"]
"lumen.geo" = ["data/*.tsv.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use Chinese text, where full-width punctuation is intended.
"tests/*" = ["RUF001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Path"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["lumen"]

[[tool.mypy.overrides]]
module = [
    "rawpy.*", "exiftool.*", "pillow_heif.*", "torch.*", "transformers.*", "open_clip.*",
    "huggingface_hub.*", "keyring.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# transformers / open_clip ship partial type information.
module = ["lumen.ai.encoders"]
disallow_untyped_calls = false
